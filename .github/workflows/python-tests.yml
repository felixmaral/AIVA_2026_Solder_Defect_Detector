name: Python Unit Tests CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      # libgl1: requerido por opencv-python en Ubuntu (headless)
      # python3-dev + gcc: requeridos para compilar el C binding
      run: sudo apt-get update && sudo apt-get install -y libgl1 gcc python3-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_dev.txt

    - name: Compile C binding library
      run: make -C src/c_bindings

    - name: Execute Python tests
      # Se inyecta la variable PYTHONPATH para emular el comportamiento del archivo .env local
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        # Ejecutar explícitamente los test del código principal, omitiendo la carpeta _mockup/
        python -m unittest -v \
          tests.test_vision \
          tests.test_hardware \
          tests.test_pcb_image \
          tests.test_solder_defect \
          tests.test_detection_result \
          tests.test_main_integration \
          tests.test_c_bindings

    - name: Code Quality Report (Pylint)
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        # Pylint analiza el código fuente y emite un informe completo con:
        #   - Puntuación de calidad (0-10)
        #   - Errores, warnings y code smells
        #   - Complejidad ciclomática
        #   - Duplicaciones de código
        #   - Porcentaje de funciones documentadas
        #
        # --exit-zero: el paso siempre tiene éxito aunque la puntuación sea baja,
        # de modo que el informe queda visible en los logs sin bloquear el pipeline.
        pylint src/ --exit-zero